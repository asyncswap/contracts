name: notify proofs

# Every push to the protocol dispatches the formal-mind bot in asyncswap/v2-proofs.
# Requires secret PROOFS_DISPATCH_TOKEN: a fine-grained token with `contents: write`
# on asyncswap/v2-proofs (repository_dispatch needs write).
on:
  push:
    paths:
      - "src/**"
      - "test/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → asyncswap/v2-proofs
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PROOFS_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/asyncswap/v2-proofs/dispatches \
            -d "$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
                  --arg msg "${{ github.event.head_commit.message }}" \
                  '{event_type:"protocol-push", client_payload:{repo:$repo, sha:$sha, message:$msg}}')"
