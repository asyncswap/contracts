name: CI

permissions: {}

on:
  # Pull requests run on pull_request; push runs only for main, so a PR branch isn't checked twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: a new Foundry release can change test semantics (1.8 made `isolate` the default).
          # Bump it on purpose, together with the local toolchain (`foundryup --install <version>`).
          version: v1.8.6

      - name: Show Forge version
        run: forge --version

      - name: Install Soldeer dependencies
        run: forge soldeer install

      - name: Run Forge fmt
        run: forge fmt --check

      # Compile everything, then enforce deployment limits for every artifact owned by src/.
      # Test harnesses and vendor fixtures (including PoolManager at our optimizer setting)
      # are not deployed protocol modules; keep their compilation without imposing our size budget.
      - name: Build and check production contract sizes
        run: |
          forge build
          python3 script/check-contract-sizes.py

      # The invariant suites run at the depth MAINNET_READINESS.md records (foundry.toml), failing on any
      # unexpected revert.
      - name: Run Forge tests
        run: forge test -vvv
