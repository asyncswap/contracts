name = "asyncswap-proofs"
version = "0.1.0"
defaultTargets = ["AsyncSwapSpec", "AsyncSwapProtocol", "Generated", "Refinement"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

# v2 hook: fee, matching, partial fills, escrow invariant, admin, radix price tree
[[lean_lib]]
name = "AsyncSwapSpec"

# Call-sequence state machine: Router / PoolManager / hook / FeeVault / ledgers
[[lean_lib]]
name = "AsyncSwapProtocol"

# The Lean model of each entry contract, generated by Formal Mind's formal-ast from solc's AST
# (`formal/scripts/generate.sh`). Each file carries its own copy of the `FormalAst` prelude, so they are
# built one module at a time and never imported together.
[[lean_lib]]
name = "Generated"
globs = ["Generated.+"]

# Refinement: each generated def against the AsyncSwapProtocol.V2 operation it implements
[[lean_lib]]
name = "Refinement"
globs = ["Refinement.+"]
