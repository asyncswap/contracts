name = "asyncswap-current-proofs"
version = "0.1.0"
defaultTargets = ["Generated", "Refinement"]
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"
[[lean_lib]]
name = "Generated"
globs = ["Generated.+"]
[[lean_lib]]
name = "Refinement"
globs = ["Refinement.+"]
